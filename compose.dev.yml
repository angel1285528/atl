services:
  application:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gestionatl-develop-app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      POSTGRES_PRISMA_URL: postgresql://gestionatl_dev:${GESTIONATL_DEV_DB_PASSWORD}@database:5432/gestionatl_development?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://gestionatl_dev:${GESTIONATL_DEV_DB_PASSWORD}@database:5432/gestionatl_development?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Define BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: http://100.66.202.2:8094
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "100.66.202.2:8094:3000"
      - "127.0.0.1:8094:3000"

  database:
    image: postgres:17-alpine
    container_name: gestionatl-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestionatl_development
      POSTGRES_USER: gestionatl_dev
      POSTGRES_PASSWORD: ${GESTIONATL_DEV_DB_PASSWORD:?Define GESTIONATL_DEV_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gestionatl_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestionatl_dev -d gestionatl_development"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gestionatl_dev_postgres_data:
