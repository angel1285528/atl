<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#071a3d" />
    <title>Sitio en reconstrucción | Academia Tigres Linares</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #fff;
        background: radial-gradient(
            circle at 18% 18%,
            rgba(250, 204, 21, 0.22),
            transparent 30rem
          ),
          radial-gradient(
            circle at 82% 85%,
            rgba(37, 99, 235, 0.28),
            transparent 32rem
          ),
          #071a3d;
      }

      main {
        width: min(90%, 44rem);
        padding: 4rem 2rem;
        text-align: center;
      }

      .mark {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 2rem;
        display: grid;
        place-items: center;
        border: 2px solid #facc15;
        border-radius: 50%;
        color: #facc15;
        font-size: 2rem;
        font-weight: 900;
        box-shadow: 0 0 0 10px rgba(250, 204, 21, 0.08);
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: #facc15;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 0.98;
        letter-spacing: -0.05em;
      }

      .message {
        max-width: 34rem;
        margin: 1.5rem auto 0;
        color: #cbd5e1;
        font-size: clamp(1rem, 2.5vw, 1.2rem);
        line-height: 1.7;
      }

      .line {
        width: 5rem;
        height: 0.25rem;
        margin: 2rem auto 0;
        border-radius: 999px;
        background: #facc15;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">ATL</div>
      <p class="eyebrow">Academia Tigres Linares</p>
      <h1>Sitio en reconstrucción</h1>
      <p class="message">
        Estamos preparando una nueva experiencia. Regresaremos muy pronto.
      </p>
      <div class="line" aria-hidden="true"></div>
    </main>
  </body>
</html>
